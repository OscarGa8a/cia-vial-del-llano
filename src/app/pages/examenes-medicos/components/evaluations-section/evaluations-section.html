<section class="bg-surface-alt py-12 md:py-20" aria-labelledby="medical-exams-evaluations-heading">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mb-14 text-center">
      <span class="mb-4 inline-block rounded-full bg-success-light px-4 py-1.5 text-xs font-bold uppercase tracking-widest text-success">Exámenes médicos para licencia</span>
      <h2 id="medical-exams-evaluations-heading" class="mb-4 font-sans text-3xl font-bold text-text-primary sm:text-4xl">Áreas de los exámenes médicos</h2>
      <p class="mx-auto max-w-2xl text-lg text-text-secondary">Solicita los exámenes médicos para licencia y confirma los detalles para tu caso.</p>
    </div>
    <div class="grid gap-6 md:grid-cols-3">
      @for (evaluation of evaluations; track evaluation.title) {
        <article class="card-hover rounded-2xl border border-border bg-white p-7 text-center shadow-sm">
          <div class="mx-auto flex size-14 items-center justify-center rounded-2xl bg-primary-lighter text-primary" aria-hidden="true"><app-icon [lucideIcon]="evaluation.icon" [size]="24" /></div>
          <h3 class="mt-5 font-sans text-xl font-bold text-text-primary">{{ evaluation.title }}</h3>
          <p class="mt-3 text-sm leading-relaxed text-text-secondary">{{ evaluation.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
