<section class="bg-surface-alt py-12 md:py-20" aria-labelledby="medical-exams-process-heading">
  <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">
    <div class="mb-14 text-center">
      <span class="mb-4 inline-block rounded-full bg-primary-lighter px-4 py-1.5 text-xs font-bold uppercase tracking-widest text-primary">Cómo solicitar el servicio</span>
      <h2 id="medical-exams-process-heading" class="mb-4 font-sans text-3xl font-bold text-text-primary sm:text-4xl">Solicita tus exámenes médicos</h2>
      <p class="mx-auto max-w-2xl text-lg text-text-secondary">Solicita el servicio por WhatsApp y continúa con la información confirmada para tu caso.</p>
    </div>
    <ol class="relative ml-6 flex flex-col gap-8 border-l-2 border-primary/20 pl-6 md:ml-0 md:pl-8" role="list">
      @for (step of steps; track step.title; let index = $index) {
        <li class="relative"><span class="absolute -left-[3.15rem] flex size-10 items-center justify-center rounded-full bg-primary font-sans font-bold text-white ring-4 ring-surface-alt">{{ index + 1 }}</span><h3 class="font-sans text-xl font-bold text-text-primary">{{ step.title }}</h3><p class="mt-2 leading-relaxed text-text-secondary">{{ step.description }}</p></li>
      }
    </ol>
    <div class="mt-12 text-center"><button type="button" (click)="contact()" class="inline-flex items-center gap-3 rounded-full bg-whatsapp px-8 py-4 text-lg font-semibold text-white shadow-lg transition-transform hover:scale-105 hover:bg-whatsapp-hover active:scale-95"><app-icon source="custom" name="whatsapp-custom" [size]="22" />Solicitar exámenes</button></div>
  </div>
</section>
