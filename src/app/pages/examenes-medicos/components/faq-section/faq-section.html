<section id="preguntas" class="bg-white py-12 md:py-20" aria-labelledby="medical-exams-faq-heading">
  <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">
    <div class="mb-14 text-center">
      <span class="mb-4 inline-block rounded-full bg-accent-light px-4 py-1.5 text-xs font-bold uppercase tracking-widest text-accent">Preguntas frecuentes</span>
      <h2 id="medical-exams-faq-heading" class="mb-4 font-sans text-3xl font-bold text-text-primary sm:text-4xl">Preguntas sobre exámenes médicos para licencia</h2>
      <p class="mx-auto max-w-xl text-lg text-text-secondary">Información general para confirmar qué aplica a tu trámite en Villavicencio.</p>
    </div>
    <div class="flex flex-col gap-3" role="list">
      @for (faq of faqs; track faq.id) {
        <article class="overflow-hidden rounded-2xl border border-border bg-white shadow-sm" role="listitem">
          <button [id]="'medical-exams-faq-btn-' + faq.id" type="button" class="flex w-full items-center justify-between gap-4 px-6 py-5 text-left transition-colors hover:bg-gray-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary/40" (click)="toggleItem(faq.id)" [attr.aria-expanded]="openFaqId() === faq.id" [attr.aria-controls]="'medical-exams-faq-answer-' + faq.id">
            <span class="text-sm font-semibold leading-snug text-text-primary sm:text-base">{{ faq.question }}</span>
            <span class="flex size-7 shrink-0 items-center justify-center rounded-full bg-gray-100 transition-transform duration-300" [class.rotate-180]="openFaqId() === faq.id" [class.bg-primary-lighter]="openFaqId() === faq.id" aria-hidden="true"><app-icon [class.text-primary]="openFaqId() === faq.id" [lucideIcon]="ChevronDownIcon" [size]="14" /></span>
          </button>
          <div [id]="'medical-exams-faq-answer-' + faq.id" class="faq-content" [class.open]="openFaqId() === faq.id" role="region" [attr.aria-labelledby]="'medical-exams-faq-btn-' + faq.id" [attr.aria-hidden]="openFaqId() === faq.id ? null : 'true'" [attr.inert]="openFaqId() === faq.id ? null : ''"><div><p class="border-t border-border px-6 pb-5 pt-4 text-sm leading-relaxed text-text-secondary">{{ faq.answer }}</p></div></div>
        </article>
      }
    </div>
  </div>
</section>
