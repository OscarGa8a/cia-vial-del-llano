<section class="relative overflow-hidden bg-linear-to-br from-primary via-primary-dark to-accent py-12 md:py-20" aria-labelledby="license-renewal-final-cta-heading">
  <div class="relative mx-auto max-w-3xl px-4 text-center sm:px-6 lg:px-8">
    <div class="mx-auto mb-8 flex size-20 items-center justify-center rounded-full border-2 border-white/20 bg-white/10 text-white" aria-hidden="true"><app-icon [lucideIcon]="MessageCircleIcon" [size]="40" /></div>
    <h2 id="license-renewal-final-cta-heading" class="mb-6 font-sans text-3xl font-bold leading-tight text-white sm:text-4xl lg:text-5xl">Solicita la <span class="text-highlight">refrendación de tu licencia</span></h2>
    <p class="mx-auto mb-10 max-w-2xl text-lg leading-relaxed text-white/80 sm:text-xl">Solicita el servicio por WhatsApp y confirma la atención y los detalles aplicables para tu caso.</p>
    <button type="button" (click)="contact()" class="inline-flex items-center gap-3 rounded-full bg-whatsapp px-10 py-5 text-lg font-bold text-white shadow-2xl transition-transform hover:scale-105 hover:bg-whatsapp-hover active:scale-95" aria-label="Solicitar servicio de refrendación de licencia por WhatsApp">
      <app-icon source="custom" name="whatsapp-custom" [size]="26" />
      Solicitar refrendación
    </button>
  </div>
</section>
